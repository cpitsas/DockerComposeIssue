services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: asdsadg123
    volumes:
      - rabbitmq_composeissue_data_dev:/var/lib/rabbitmq
    networks:
      - composeissue-net

  db_payments:
    image: postgres:17
    environment:
      POSTGRES_USER: payments_user
      POSTGRES_PASSWORD: asd123
      POSTGRES_DB: db_payments
    ports:
      - "5532:5432"
    volumes:
      - pgdata_composeissue_payments_dev:/var/lib/postgresql/data
    networks:
      - composeissue-net

  db_orders:
    image: postgres:17
    environment:
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: dasd123
      POSTGRES_DB: db_orders
    ports:
      - "5533:5432"
    volumes:
      - pgdata_composeissue_orders_dev:/var/lib/postgresql/data
    networks:
      - composeissue-net

  ordersapi:
    image: ${DOCKER_REGISTRY-}dockercomposeissueordersapi
    build:
      context: .
      dockerfile: Orders/DockerComposeIssue.Orders.API/Dockerfile
    environment:
      - RabbitMq__Host=rabbitmq
    depends_on:
      - db_orders
    ports:
      - "6080:8080"
    networks:
      - composeissue-net

  ordersconsumer:
    image: ${DOCKER_REGISTRY-}dockercomposeissueordersconsumer
    build:
      context: .
      dockerfile: Orders/DockerComposeIssue.Orders.Consumer/Dockerfile
    environment:
      - RabbitMq__Host=rabbitmq
    depends_on:
      - db_orders
      - rabbitmq
    networks:
      - composeissue-net


  paymentsapi:
    image: ${DOCKER_REGISTRY-}dockercomposeissuepaymentsapi
    build:
      context: .
      dockerfile: Payments/DockerComposeIssue.Payments.API/Dockerfile
    environment:
      - RabbitMq__Host=rabbitmq
    depends_on:
      - db_payments
    ports:
      - "6081:8080"
    networks:
      - composeissue-net


  paymentsconsumer:
    image: ${DOCKER_REGISTRY-}dockercomposeissuepaymentsconsumer
    build:
      context: .
      dockerfile: Payments/DockerComposeIssue.Payments.Consumer/Dockerfile
    environment:
      - RabbitMq__Host=rabbitmq
    depends_on:
      - db_payments
      - rabbitmq
    networks:
      - composeissue-net


  gateway:
    image: ${DOCKER_REGISTRY-}dockercomposeissuegatewayapi
    build:
      context: .
      dockerfile: DockerComposeIssue.Gateway.API/Dockerfile
    environment:
      - RabbitMq__Host=rabbitmq
    depends_on:
      - paymentsapi
      - ordersapi
    ports:
      - "6082:8080"
    networks:
      - composeissue-net


  storeweb:
    image: ${DOCKER_REGISTRY-}composeissue-storeweb:dev
    build:
      context: ./FrontClients
      dockerfile: dockercomposeissue.store.web/Dockerfile
    environment:
      - NODE_ENV=development
      - REACT_APP_STORE_API=http://gateway:8080
    ports:
      - "3050:80"
    depends_on:
      - gateway
    networks:
      - composeissue-net

  notificationsapi:
    image: ${DOCKER_REGISTRY-}dockercomposeissuenotificationsapi
    build:
      context: .
      dockerfile: Notifications/DockerComposeIssue.Notifications.API/Dockerfile
    environment:
      - RabbitMq__Host=rabbitmq
    depends_on:
      - db_payments
    ports:
      - "6083:8080"
    networks:
      - composeissue-net

  notificationsconsumer:
    image: ${DOCKER_REGISTRY-}dockercomposeissuenotificationsconsumer
    build:
      context: .
      dockerfile: Notifications/DockerComposeIssue.Notifications.Consumer/Dockerfile
    environment:
      - RabbitMq__Host=rabbitmq
    depends_on:
      - db_payments
    networks:
      - composeissue-net

networks:
  composeissue-net:
    name: composeissue-net
    driver: bridge

volumes:
  pgdata_composeissue_orders_dev:
  pgdata_composeissue_payments_dev:
  rabbitmq_composeissue_data_dev:

